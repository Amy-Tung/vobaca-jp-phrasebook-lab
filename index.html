<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Vobaca!! BREAK｜標籤實驗室</title><style>body{font-family:system-ui,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;color:#2c2c2b}p{padding:24px}</style></head><body><p id="s">正在載入標籤實驗室…</p><script>(async()=>{try{const base='https://raw.githubusercontent.com/Amy-Tung/vobaca-jp-phrasebook/033c6dc4c3147aaf186a3749f559d6d180d28389/assets/';let b='';for(let i=1;i<=3;i++){const r=await fetch(`${base}site.part${i}.txt`,{cache:'no-store'});if(!r.ok)throw new Error(`HTTP ${r.status}`);b+=await r.text()}let a=Uint8Array.from(atob(b),c=>c.charCodeAt(0));let t=await new Response(new Blob([a]).stream().pipeThrough(new DecompressionStream('gzip'))).text();t=t.replace('active==="all"||p.c===active','active==="all"||(active==="essential"?!!p.e:p.c===active)').replace('</head>','<meta name="robots" content="noindex,nofollow"></head>').replace('</body>','<script src="custom-tags.js"><\/script></body>');document.open();document.write(t);document.close()}catch(e){console.error(e);document.getElementById('s').textContent='載入失敗，請重新整理頁面。'}})();</script></body></html>
